<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTB COLA Records Viewer</title>
  <script src="ttb_cola_ttb_ids.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e6edf3;
      --muted: #9da7b3;
      --line: #30363d;
      --panel: #161b22;
      --surface: #0d1117;
      --accent: #58a6ff;
      --bar: #3fb950;
      --bar-hover: #f0883e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--surface);
    }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: grid;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 650;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(280px, 400px) auto minmax(220px, 1fr);
      gap: 10px;
      align-items: end;
    }
    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    input, select, button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      padding: 0 10px;
    }
    .date-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .date-control { grid-column: 1; grid-row: 1; }
    #globalSearch { grid-column: 1; grid-row: 2; }
    .checkbox-option {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      align-self: end;
      gap: 8px;
      height: 34px;
      color: var(--ink);
      font-size: 14px;
      white-space: nowrap;
    }
    .checkbox-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
    }
    button {
      cursor: pointer;
      font-weight: 650;
    }
    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    main {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
    }
    .plot-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
    }
    .plot-wrap > canvas, .plot-wrap > .status, .plot-wrap > .tip { display: none; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .status {
      position: absolute;
      left: 16px;
      bottom: 12px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(22,27,34,0.94);
      color: var(--muted);
      font-size: 12px;
    }
    .tip {
      position: fixed;
      pointer-events: none;
      display: none;
      max-width: min(380px, calc(100vw - 24px));
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(22,27,34,0.98);
      box-shadow: 0 12px 30px rgba(0,0,0,0.38);
      font-size: 12px;
      line-height: 1.35;
      z-index: 5;
    }
    .tip strong {
      display: block;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }
    .tip span {
      color: var(--muted);
    }
    .record-panel { position: absolute; inset: 0; z-index: 2; display: block; overflow: auto; background: var(--surface); }
    .record-panel.is-visible { display: block; }
    .record-panel-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 700; }
    .record-panel-head span { color: var(--muted); font-size: 12px; font-weight: 600; }
    .panel-close { width: 28px; min-width: 28px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
    .panel-close:hover { background: transparent; color: var(--ink); }
    .record-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .record-table th, .record-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .record-table th { position: sticky; background: var(--surface); color: var(--muted); font-weight: 700; }
    .record-table thead tr:first-child th { top: 39px; z-index: 1; }
    .record-sort { width: 100%; height: 26px; padding: 0; border: 0; background: transparent; color: inherit; font-size: 12px; text-align: left; white-space: nowrap; }
    .record-sort:hover { background: transparent; }
    .record-sort[data-direction="asc"]::after { content: "  ▲"; }
    .record-sort[data-direction="desc"]::after { content: "  ▼"; }
    .record-table a { color: var(--accent); font-weight: 650; }
    .record-panel-footer { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 9px 14px; border-top: 1px solid var(--line); background: var(--panel); }
    @media (max-width: 960px) {
      .controls { grid-template-columns: 1fr 1fr; }
      main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      .title-row { display: grid; }
      .meta { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1>TTB COLA Records Viewer</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="controls">
        <label class="date-control">Completed Date
          <span class="date-range">
            <input id="dateStart" type="date" aria-label="Start date">
            <input id="dateEnd" type="date" aria-label="End date">
          </span>
        </label>
        <input id="globalSearch" type="search" placeholder="Search" aria-label="Search all record fields">
        <label class="checkbox-option"><input id="dspOnly" type="checkbox"> <span>DSPs Only</span></label>
        <div hidden aria-hidden="true">
          <select id="columnSelect"></select>
          <select id="limitSelect"><option value="all" selected>All values</option></select>
          <select id="sortSelect">
            <option value="count-desc">Count descending</option>
          </select>
          <button id="downloadCsv" type="button">Download counts</button>
        </div>
      </div>
    </header>
    <main>
      <div class="plot-wrap">
        <canvas id="plot"></canvas>
        <div class="status" id="status"></div>
        <div class="tip" id="tip"></div>
        <section class="record-panel" id="recordPanel" aria-live="polite">
          <div class="record-panel-head"><div id="recordTitle">Records</div><span id="recordSummary"></span><button class="panel-close" id="closeRecordPanel" type="button" hidden aria-label="Close results">×</button></div>
          <table class="record-table"><thead>
            <tr>
              <th><button class="record-sort" type="button" data-column="TTB ID">TTB ID</button></th>
              <th><button class="record-sort" type="button" data-column="Completed Date">Completed Date</button></th>
              <th><button class="record-sort" type="button" data-column="Permit No.">Permit No.</button></th>
              <th><button class="record-sort" type="button" data-column="Brand Name">Brand Name</button></th>
              <th><button class="record-sort" type="button" data-column="Fanciful Name">Fanciful Name</button></th>
              <th><button class="record-sort" type="button" data-column="Class/Type Desc">Class/Type</button></th>
            </tr>
          </thead><tbody id="recordList"></tbody></table>
          <div class="record-panel-footer"><button id="previousRecordPage" type="button">Previous</button><button id="nextRecordPage" type="button">Next</button></div>
        </section>
      </div>
    </main>
  </div>
  <script id="payload" type="application/json"></script>
  <script>
(async () => {
  const response = await fetch('ttb_cola_records.json');
  if (!response.ok) throw new Error(`Could not load viewer data: ${response.status}`);
  const data = await response.json();
  const canvas = document.getElementById('plot');
  const ctx = canvas.getContext('2d');
  const columnSelect = document.getElementById('columnSelect');
  const limitSelect = document.getElementById('limitSelect');
  const dateStart = document.getElementById('dateStart');
  const dateEnd = document.getElementById('dateEnd');
  const dspOnly = document.getElementById('dspOnly');
  const sortSelect = document.getElementById('sortSelect');
  const downloadCsv = document.getElementById('downloadCsv');
  const globalSearch = document.getElementById('globalSearch');
  const meta = document.getElementById('meta');
  const status = document.getElementById('status');
  const tip = document.getElementById('tip');
  const recordPanel = document.getElementById('recordPanel');
  const recordTitle = document.getElementById('recordTitle');
  const recordSummary = document.getElementById('recordSummary');
  const recordList = document.getElementById('recordList');
  const closeRecordPanel = document.getElementById('closeRecordPanel');
  const previousRecordPage = document.getElementById('previousRecordPage');
  const nextRecordPage = document.getElementById('nextRecordPage');
  const recordSortButtons = [...document.querySelectorAll('.record-sort')];
  const ttbIds = window.TTB_COLA_IDS || [];
  const detailUrl = 'https://www.ttbonline.gov/colasonline/viewColaDetails.do?action=publicFormDisplay&ttbid=';
  const cleanTtbId = value => String(value || '').trim().replace(/^['"]+|['"]+$/g, '');
  const recordPageSize = 100;
  let visibleBars = [];
  let hoveredIndex = -1;
  let selectedBarIndex = -1;
  let selectedRecordIndexes = [];
  let recordPage = 0;
  let filteredRowCount = data.rowCount;
  let totalUnique = 0;
  const completedDateColumnIndex = data.columns.indexOf('Completed Date');
  const permitColumnIndex = data.columns.indexOf('Permit No.');
  const completedDateCache = new WeakMap();
  let recordSortColumn = 'Completed Date';
  let recordSortDirection = 'desc';

  columnSelect.innerHTML = data.columns.map(column =>
    `<option value="${escapeAttr(column)}">${escapeHtml(column)}</option>`
  ).join('');
  if (data.columns.includes('Brand Name')) columnSelect.value = 'Brand Name';
  const updatedAt = new Date(data.generatedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  const newest = data.newestCompletedDate ? ` | Latest completed record: ${data.newestCompletedDate}` : "";
  meta.textContent = `${data.rowCount.toLocaleString()} rows | ${data.columns.length} columns | Updated ${updatedAt}${newest}`;

  initializeDateRange();

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function escapeAttr(value) { return escapeHtml(value); }
  function plotBox() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    return { left: 78, right: w - 24, top: 24, bottom: h - 120, width: w - 102, height: h - 144 };
  }
  function resize() {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(canvas.clientWidth * ratio));
    canvas.height = Math.max(1, Math.floor(canvas.clientHeight * ratio));
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    draw();
  }
  function valueFor(row, columnIndex) {
    const value = String(row[columnIndex] || '').trim();
    return value || '(blank)';
  }
  function completedDateFor(row) {
    if (completedDateColumnIndex < 0) return '';
    if (completedDateCache.has(row)) return completedDateCache.get(row);
    const match = String(row[completedDateColumnIndex] || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    const value = match
      ? `${match[3]}-${match[1].padStart(2, '0')}-${match[2].padStart(2, '0')}`
      : '';
    completedDateCache.set(row, value);
    return value;
  }
  function initializeDateRange() {
    const dates = data.rows.map(completedDateFor).filter(Boolean).sort();
    if (!dates.length) {
      dateStart.disabled = true;
      dateEnd.disabled = true;
      return;
    }
    dateStart.min = dateEnd.min = dates[0];
    dateStart.max = dateEnd.max = dates[dates.length - 1];
    dateStart.value = dates[0];
    dateEnd.value = dates[dates.length - 1];
  }
  function dateFilterAllows(row) {
    const date = completedDateFor(row);
    return Boolean(date) && (!dateStart.value || date >= dateStart.value) && (!dateEnd.value || date <= dateEnd.value);
  }
  function dspFilterAllows(row) {
    if (!dspOnly.checked) return true;
    if (permitColumnIndex < 0) return false;
    return String(row[permitColumnIndex] || '').toUpperCase().includes('DSP');
  }
  function searchFilterAllows(row, index) {
    const needle = globalSearch.value.trim().toLowerCase();
    if (!needle) return true;
    const values = [cleanTtbId(ttbIds[index]), ...row];
    return values.some(value => String(value || '').toLowerCase().includes(needle));
  }
  function sideFiltersAllow(row, index) {
    return dateFilterAllows(row) && dspFilterAllows(row) && searchFilterAllows(row, index);
  }
  function rowsAfterFieldFilter() {
    return data.rows.filter((row, index) => sideFiltersAllow(row, index));
  }
  function currentRows() {
    const column = columnSelect.value;
    const columnIndex = data.columns.indexOf(column);
    const counts = new Map();
    const sourceRows = rowsAfterFieldFilter();
    filteredRowCount = sourceRows.length;
    for (const row of sourceRows) {
      const value = valueFor(row, columnIndex);
      counts.set(value, (counts.get(value) || 0) + 1);
    }
    totalUnique = counts.size;
    let rows = [...counts.entries()].map(([label, count]) => [String(label), Number(count)]);
    rows.sort((a, b) => {
      if (sortSelect.value === 'count-asc') return a[1] - b[1] || a[0].localeCompare(b[0]);
      if (sortSelect.value === 'label-asc') return a[0].localeCompare(b[0]);
      if (sortSelect.value === 'label-desc') return b[0].localeCompare(a[0]);
      return b[1] - a[1] || a[0].localeCompare(b[0]);
    });
    const limit = limitSelect.value === 'all' ? rows.length : Number(limitSelect.value);
    return rows.slice(0, limit);
  }
  function drawAxes(box, maxCount) {
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(box.left, box.top);
    ctx.lineTo(box.left, box.bottom);
    ctx.lineTo(box.right, box.bottom);
    ctx.stroke();

    ctx.fillStyle = '#9da7b3';
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const ticks = 5;
    for (let i = 0; i <= ticks; i += 1) {
      const value = Math.round((maxCount / ticks) * i);
      const y = box.bottom - (value / Math.max(1, maxCount)) * box.height;
      ctx.fillText(value.toLocaleString(), box.left - 8, y);
      ctx.strokeStyle = 'rgba(48,54,61,0.65)';
      ctx.beginPath();
      ctx.moveTo(box.left, y);
      ctx.lineTo(box.right, y);
      ctx.stroke();
    }

    ctx.fillStyle = '#e6edf3';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Count', 32, 20);
    ctx.fillText(columnSelect.value, (box.left + box.right) / 2, canvas.clientHeight - 12);
  }
  function drawLabels(box, barWidth, gap) {
    const labelEvery = visibleBars.length > 80 ? Math.ceil(visibleBars.length / 40) : 1;
    ctx.fillStyle = '#9da7b3';
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    visibleBars.forEach((bar, i) => {
      if (i % labelEvery !== 0) return;
      const x = box.left + i * (barWidth + gap) + barWidth / 2;
      ctx.save();
      ctx.translate(x, box.bottom + 8);
      ctx.rotate(-Math.PI / 4);
      const label = bar.label.length > 34 ? bar.label.slice(0, 33) + '...' : bar.label;
      ctx.fillText(label, 0, 0);
      ctx.restore();
    });
  }
  function draw(recompute = true) {
    const box = plotBox();
    ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    if (recompute) {
      visibleBars = currentRows().map(([label, count]) => ({ label, count, x: 0, y: 0, w: 0, h: 0 }));
    }
    const maxCount = Math.max(1, ...visibleBars.map(bar => bar.count));
    drawAxes(box, maxCount);

    const gap = visibleBars.length > 120 ? 1 : 3;
    const barWidth = Math.max(1, (box.width - gap * Math.max(0, visibleBars.length - 1)) / Math.max(1, visibleBars.length));
    visibleBars.forEach((bar, i) => {
      const height = (bar.count / maxCount) * box.height;
      bar.x = box.left + i * (barWidth + gap);
      bar.y = box.bottom - height;
      bar.w = barWidth;
      bar.h = height;
      ctx.fillStyle = i === hoveredIndex || i === selectedBarIndex ? '#f0883e' : '#3fb950';
      ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
    });
    drawLabels(box, barWidth, gap);

    const shown = visibleBars.length.toLocaleString();
    const dateText = dateStart.value && dateEnd.value
      ? ` | ${dateStart.value} to ${dateEnd.value}`
      : '';
    const dspText = dspOnly.checked ? ' | DSPs only' : '';
    const searchText = globalSearch.value.trim() ? ' | search: "' + globalSearch.value.trim() + '"' : '';
    status.textContent = `${shown} shown | ${totalUnique.toLocaleString()} unique values | ${filteredRowCount.toLocaleString()} rows | ${columnSelect.value}${dateText}${dspText}${searchText}`;
  }
  function barAt(mx, my) {
    return visibleBars.findIndex(bar =>
      mx >= bar.x && mx <= bar.x + bar.w && my >= bar.y && my <= bar.y + bar.h
    );
  }
  function showTip(index, event) {
    if (index < 0) {
      tip.style.display = 'none';
      return;
    }
    const bar = visibleBars[index];
    const pct = filteredRowCount ? (bar.count / filteredRowCount * 100).toFixed(2) : '0.00';
    tip.innerHTML = `<strong>${escapeHtml(bar.label)}</strong><span>${bar.count.toLocaleString()} rows | ${pct}%</span>`;
    tip.style.display = 'block';
    const pad = 14;
    const rect = tip.getBoundingClientRect();
    let left = event.clientX + pad;
    let top = event.clientY + pad;
    if (left + rect.width > window.innerWidth) left = event.clientX - rect.width - pad;
    if (top + rect.height > window.innerHeight) top = event.clientY - rect.height - pad;
    tip.style.left = `${Math.max(6, left)}px`;
    tip.style.top = `${Math.max(6, top)}px`;
  }
  function refresh() {
    hoveredIndex = -1;
    selectedBarIndex = -1;
    selectedRecordIndexes = filteredRecordIndexes();
    recordPage = 0;
    recordTitle.textContent = 'Records';
    recordPanel.classList.add('is-visible');
    showTip(-1);
    updateRecordSortIndicators();
    renderSelectedRecords();
  }
  function recordValue(index, column) {
    if (column === 'TTB ID') return cleanTtbId(ttbIds[index]);
    const columnIndex = data.columns.indexOf(column);
    return columnIndex < 0 ? '' : String(data.rows[index][columnIndex] || '').trim();
  }
  function filteredRecordIndexes() {
    const indexes = [];
    data.rows.forEach((row, index) => {
      if (!sideFiltersAllow(row, index)) return;
      indexes.push(index);
    });
    indexes.sort((a, b) => {
      let comparison;
      if (recordSortColumn === 'Completed Date') {
        comparison = completedDateFor(data.rows[a]).localeCompare(completedDateFor(data.rows[b]));
      } else {
        comparison = recordValue(a, recordSortColumn).localeCompare(recordValue(b, recordSortColumn), undefined, {
          numeric: true,
          sensitivity: 'base'
        });
      }
      if (!comparison) comparison = a - b;
      return recordSortDirection === 'asc' ? comparison : -comparison;
    });
    return indexes;
  }
  function updateRecordSortIndicators() {
    recordSortButtons.forEach(button => {
      button.dataset.direction = button.dataset.column === recordSortColumn ? recordSortDirection : '';
      button.setAttribute('aria-sort', button.dataset.column === recordSortColumn
        ? (recordSortDirection === 'asc' ? 'ascending' : 'descending')
        : 'none');
    });
  }
  function recordsForBar(bar) {
    const columnIndex = data.columns.indexOf(columnSelect.value);
    return data.rows.reduce((indexes, row, index) => {
      if (sideFiltersAllow(row, index) && valueFor(row, columnIndex) === bar.label) indexes.push(index);
      return indexes;
    }, []);
  }
  function renderSelectedRecords() {
    const total = selectedRecordIndexes.length;
    const first = recordPage * recordPageSize;
    const shown = selectedRecordIndexes.slice(first, first + recordPageSize);
    const columnIndex = name => data.columns.indexOf(name);
    const values = (row, name) => {
      const index = columnIndex(name);
      return index < 0 ? '' : String(row[index] || '');
    };
    recordList.innerHTML = shown.map(index => {
      const row = data.rows[index];
      const ttbId = cleanTtbId(ttbIds[index]);
      const idCell = ttbId
        ? `<a href="${detailUrl}${encodeURIComponent(ttbId)}" target="_blank" rel="noopener noreferrer">${escapeHtml(ttbId)}</a>`
        : '<span>(missing)</span>';
      return `<tr><td>${idCell}</td><td>${escapeHtml(values(row, 'Completed Date'))}</td><td>${escapeHtml(values(row, 'Permit No.'))}</td><td>${escapeHtml(values(row, 'Brand Name'))}</td><td>${escapeHtml(values(row, 'Fanciful Name'))}</td><td>${escapeHtml(values(row, 'Class/Type Desc'))}</td></tr>`;
    }).join('');
    const firstShown = total ? first + 1 : 0;
    recordSummary.textContent = `${firstShown.toLocaleString()}–${Math.min(first + recordPageSize, total).toLocaleString()} of ${total.toLocaleString()}`;
    previousRecordPage.disabled = recordPage === 0;
    nextRecordPage.disabled = first + recordPageSize >= total;
  }
  function selectBar(index) {
    if (index < 0) return;
    selectedBarIndex = index;
    selectedRecordIndexes = recordsForBar(visibleBars[index]);
    recordPage = 0;
    recordTitle.textContent = `${columnSelect.value}: ${visibleBars[index].label}`;
    recordPanel.classList.add('is-visible');
    renderSelectedRecords();
    draw(false);
  }
  function closeRecords() {
    recordPanel.classList.remove('is-visible');
  }

  canvas.addEventListener('mousemove', event => {
    const next = barAt(event.offsetX, event.offsetY);
    if (next !== hoveredIndex) {
      hoveredIndex = next;
      draw(false);
    }
    showTip(hoveredIndex, event);
  });
  canvas.addEventListener('mouseleave', () => {
    hoveredIndex = -1;
    showTip(-1);
    draw(false);
  });
  canvas.addEventListener('click', event => selectBar(barAt(event.offsetX, event.offsetY)));
  closeRecordPanel.addEventListener('click', closeRecords);
  recordSortButtons.forEach(button => {
    button.addEventListener('click', () => {
      const column = button.dataset.column;
      if (recordSortColumn === column) {
        recordSortDirection = recordSortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        recordSortColumn = column;
        recordSortDirection = column === 'Completed Date' ? 'desc' : 'asc';
      }
      refresh();
    });
  });
  previousRecordPage.addEventListener('click', () => {
    recordPage -= 1;
    renderSelectedRecords();
    recordPanel.scrollTop = 0;
  });
  nextRecordPage.addEventListener('click', () => {
    recordPage += 1;
    renderSelectedRecords();
    recordPanel.scrollTop = 0;
  });
  [dateStart, dateEnd].forEach(control => {
    control.addEventListener('input', event => {
      if (dateStart.value && dateEnd.value && dateStart.value > dateEnd.value) {
        if (event.target === dateStart) dateEnd.value = dateStart.value;
        else dateStart.value = dateEnd.value;
      }
      refresh();
    });
  });
  dspOnly.addEventListener('input', () => {
    refresh();
  });
  globalSearch.addEventListener('input', refresh);
  [columnSelect, limitSelect, sortSelect].forEach(control => {
    control.addEventListener('input', refresh);
  });
  downloadCsv.addEventListener('click', () => {
    const rows = [['Selected Column', 'Completed Date Range', 'Search', 'Value', 'Count'], ...currentRows().map(([label, count]) => [
      columnSelect.value,
      `${dateStart.value || '(start)'} to ${dateEnd.value || '(end)'}`,
      globalSearch.value.trim() || '(none)',
      label,
      count
    ])];
    const csv = rows.map(row => row.map(value => {
      const text = String(value);
      return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
    }).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${columnSelect.value.replace(/[^A-Za-z0-9_-]+/g, '_')}_viewer_counts.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });
  refresh();
})();
  </script>
</body>
</html>
